# CD: when a version tag (v1.0.0) is pushed, publish a Docker image to GitHub's
# container registry (GHCR) and deploy.
name: CD

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:      # lets you run it manually from the Actions tab

permissions:
  contents: read
  packages: write         # needed to push to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: publish
    runs-on: ubuntu-latest
    environment: staging          # create this in Settings > Environments
    steps:
      - name: Deploy (placeholder)
        run: |
          echo "Pretend we deploy ${{ env.IMAGE }}:${{ github.ref_name }} to staging"
          # Real examples to try later: ssh + docker run, Azure Web App, AWS ECS, Fly.io, Render

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production       # add "Required reviewers" => manual approval gate
    steps:
      - name: Deploy (placeholder)
        run: echo "Pretend we deploy ${{ env.IMAGE }}:${{ github.ref_name }} to production"
